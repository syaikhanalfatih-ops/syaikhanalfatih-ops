<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="avatarTitle avatarDesc">
  <title id="avatarTitle">Avatar Syaikhan Al Fatih</title>
  <desc id="avatarDesc">Monogram SAF berwarna terang di atas latar gelap dengan aksen emerald dan cyan.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D17"/>
      <stop offset="0.55" stop-color="#0A1420"/>
      <stop offset="1" stop-color="#0B1820"/>
    </linearGradient>

    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientTransform="translate(402 86) rotate(120) scale(300 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(96 446) rotate(-55) scale(260 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(90) scale(190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="bar" x1="214" y1="0" x2="298" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.12"/>
    </pattern>

    <clipPath id="circle">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#dots)"/>
    <rect width="512" height="512" fill="url(#glowGreen)"/>
    <rect width="512" height="512" fill="url(#glowCyan)"/>
    <rect width="512" height="512" fill="url(#core)"/>

    <circle cx="256" cy="256" r="240" stroke="url(#ring)" stroke-width="2"/>
    <circle cx="256" cy="256" r="218" stroke="#1F2C42" stroke-width="1.5"/>

    <!-- corner ticks -->
    <path d="M72 108V72H108" stroke="#34D399" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <path d="M404 72H440V108" stroke="#34D399" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>
    <path d="M440 404V440H404" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    <path d="M108 440H72V404" stroke="#34D399" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>

    <text x="256" y="306" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="196" font-weight="700" letter-spacing="-10" fill="#F1F5F9">SAF</text>
    <rect x="214" y="340" width="84" height="8" rx="4" fill="url(#bar)"/>

    <circle cx="392" cy="392" r="16" fill="#0B1320" stroke="#080D17" stroke-width="4"/>
    <circle cx="392" cy="392" r="7" fill="#34D399"/>
  </g>
</svg>
